# Benchmark profile for RoboTwin 2.0 (aloha-agilex embodiment).
# This is the artefact produced by the "adaptation" step: everything the VLM must know about this
# robot/benchmark that is not task specific. Keys override DEFAULT_PROFILE in harness/agent/prompts.py.
# `workspace` was measured with a reachability probe of the planner; `tips` were distilled from a
# handful of calibration runs.
robot: >-
  a dual-arm robot (two 6-DoF arms, each with a two-finger parallel gripper that opens to about 9 cm) standing at
  the far side of the table from the head camera's point of view, i.e. the robot body is at y = -65 cm and the arms
  reach forward over the table (towards +y).
frame: >-
  World frame, units are centimetres. +x = to the RIGHT in the head-camera image, +y = FORWARD / AWAY from the robot
  body (towards the top of the head-camera image), +z = UP. The table top is at z = {table_z}. Objects on the table have
  their base at z ~ {table_z}-{table_z+1}.
workspace: >-
  Reachable fingertip region (measured): the LEFT arm covers x in [-45, +15] and the RIGHT arm x in [-15, +45];
  neither arm can cross the table centre by more than ~15 cm, so use the left arm for objects with x < 0 and the
  right arm for x > 0. Forward reach depends on the gripper orientation: with 'point down' an arm reaches y <= 0
  only (y <= -10 near the centre line, |x| <= 15); with 'point down45' it reaches y <= +20; with 'point forward'
  up to y <= +20 at z ~ 92. Everything works for y >= -40. Heights: z from {table_z+2} (fingertips just above the table)
  to ~110. Keep the two grippers at least 15 cm apart. A command whose target is outside this region fails without
  moving the arm.
cameras: >-
  head_camera: mounted above and behind the robot, looking down at the table; the left arm appears on the LEFT of
  the image and +y points UP the image. Coloured markers are drawn on it: a circle at each gripper's fingertip centre
  (cyan = left arm 'L', orange = right arm 'R') with a line from the wrist to the fingertips, and a small axis legend
  (+x red, +y green, +z blue). left_camera / right_camera: wrist cameras looking along the fingers of the corresponding
  arm; use them to judge alignment right before grasping.
gripper: >-
  The 'gripper position' reported below is the tool centre point between the fingertips. 'approach' is the unit
  vector the fingers point along; 'finger axis' is the direction along which the fingers open and close. At the
  start both grippers point FORWARD (+y). To grasp from above use '<arm> point down' first, then spin the finger
  axis with '<arm> rotate yaw <deg>' so that the fingers straddle the narrow side of the object. Gripper opening
  is reported 0 (closed) .. 1 (open); after a 'close' command an opening clearly above 0.1 means an object is held.
tips:
- >-
  Plan: orient the gripper ('<arm> point down'), move above the target (fingertips ~12 cm higher than the grasp
  height), align x/y using the overview image and then the wrist camera, descend until the fingertips are at grasp
  height, close, lift 10 cm, transport at a safe height, descend, open.
- >-
  Small objects on the table (cups, blocks, bottles) are grasped with the fingertips 5-7 cm above the table top,
  i.e. z = {table_z+5}-{table_z+7}; the table top itself is at z = {table_z}, so never send fingertips below z = {table_z+1}.
- >-
  Each command is executed by a motion planner; if a command reports FAILED the target was not reached
  (the note says whether the arm stayed put or moved only part of the way; the state shows where it is now). Typical causes:
  fingers would hit the table (z too low for the current orientation), pose outside the arm's reach (|x| > 45, y
  > 15 or y < -40, z > 110), or the two arms would collide. Move up / closer to the robot and retry with a smaller
  step.
- >-
  Prefer few, decisive commands: several commands per turn are fine while moving in free space; use one small command
  at a time when within 5 cm of an object.
- >-
  After a 'close' command an opening clearly above 0.1 means something is held. Verify in the next image that the
  object actually rose when you lifted; if not, open, re-align (often 1-2 cm off) and retry, possibly with a different
  yaw so the fingers straddle the narrow side.
- >-
  Placing height arithmetic: if you grasped an object with the fingertips at height z_g while it rested on the table
  (z = {table_z}), then to set it down on a surface at height h you must lower the fingertips to z_g + (h - {table_z}) (e.g.
  coaster/plate top h ~ {table_z+1}, so z_g + 1) BEFORE opening. Dropping from 3 cm or more tips the object over and fails the check, which
  typically requires the object bottom within 1.5 cm of the target surface.
- >-
  Before closing the gripper, check the wrist camera: the object must sit centred between the two fingers. A grasp
  that is 3-4 cm off-centre (e.g. only the rim of a cup) slips out when lifting. If the wrist camera shows the object
  off to one side, shift by the estimated offset first.
- >-
  Read x/y from the top_camera grid (each cell is 10 cm); read heights from the perspective view and the reported
  gripper z. Do not trust a rough guess when the grid is available.
- >-
  Travel height: keep the fingertips at z >= 88 whenever you move sideways (x or y) in free space, and only descend
  when you are directly above the target. Sweeping an arm at low height knocks objects over or off the table, which
  cannot be undone.
- >-
  If you believe the goal is reached but the episode continues, it is not reached: many checkers require the object
  to be held clearly higher (z >= 95) or moved well to the side of the arm that holds it (|x| >= 20), a container
  to be within a few cm of the target centre, or all grippers to be open at the end. Adjust and keep going instead
  of stopping.
- >-
  Never reply 'done' unless the task goal is visibly achieved. If an object seems missing, it is probably occluded
  by an arm or outside the current view: move the arms up/away, look again in all images, and continue.
